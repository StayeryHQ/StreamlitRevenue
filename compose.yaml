services:
  app:
    hostname: streamlit-revenue
    image: ghcr.io/stayeryhq/streamlit_revenue:${APP_IMAGE_TAG}
    networks:
      - streamlit
      - traefik-public
    secrets:
      - bigquery_secret
    volumes:
      - streamlit_data:/app/data
    environment:
      - GCP_SERVICE_ACCOUNT_JSON_FILE=/run/secrets/bigquery_secret
    deploy:
      # ---------------------------------------------------------------
      # F1 - Speicherlimit. Vorher gab es keins: der Container durfte sich
      # den kompletten VPS-RAM nehmen. Wenn der Refresh-Peak den Host
      # gesprengt hat, griff der globale OOM-Killer des Kernels - und der
      # sucht sich sein Opfer nach oom_score aus, nicht nach Verursacher.
      # Deshalb ist beim letzten Crash nicht nur das Dashboard gestorben,
      # sondern alles auf der Maschine (traefik, stayomat_web).
      #
      # Mit cgroup-Limit trifft ein OOM NUR diesen Container, und Swarm
      # startet ihn neu.
      #
      # ACHTUNG: 2G ist ein Startwert, KEIN gemessener. Faustregel: höchstens
      # die Hälfte des Host-RAMs, und mindestens 1,5G über dem gemessenen
      # Refresh-Peak. Peak prüfen mit:
      #     docker stats --no-stream
      # Seit F2 läuft der Refresh in einem Subprozess INNERHALB dieses
      # Containers - der Subprozess zählt also auf dasselbe Limit ein.
      # ---------------------------------------------------------------
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      # Service configuration
      - traefik.http.services.streamlit-revenue.loadbalancer.server.port=8501

      # Router for /ruby-reports path
      - traefik.http.routers.streamlit-revenue-https.rule=Host(`stayomat.de`) && PathPrefix(`/_streamlit`)
      - traefik.http.routers.streamlit-revenue-https.entrypoints=https
      - traefik.http.routers.streamlit-revenue-https.tls=true
      - traefik.http.routers.streamlit-revenue-https.tls.certresolver=le

      # ForwardAuth middleware to check authentication
      - traefik.http.middlewares.streamlit-auth.forwardauth.address=http://stayomat_web:6000/api/forward-auth/streamlit
      - traefik.http.middlewares.streamlit-auth.forwardauth.authResponseHeaders=X-User-Id
      - traefik.http.middlewares.streamlit-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.streamlit-auth.forwardauth.authRequestHeaders=Cookie

      # Strip /ruby-reports prefix before forwarding to Streamlit
      - traefik.http.middlewares.streamlit-stripprefix.stripprefix.prefixes=/_streamlit

      # Apply middlewares
      - traefik.http.routers.streamlit-revenue-https.middlewares=streamlit-auth,streamlit-stripprefix

networks:
  streamlit:
    external: true
  traefik-public:
    external: true

secrets:
  bigquery_secret:
    external: true

volumes:
  streamlit_data:
