# RevenueBlindSpots — project metadata + build config.
# Managed by uv. Run `uv sync` after editing.

[project]
name = "revenueblindspots"
version = "0.4.0"
description = "Revenue analytics for Stayery — Dash app over a BigQuery-backed parquet snapshot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Stayery Data Team" }]
license = { text = "Proprietary" }
keywords = ["hospitality", "revenue-analytics", "apaleo", "stayery", "bigquery"]

dependencies = [
    "dash>=4.3",
    "dash-mantine-components>=2.8",
    "dash-ag-grid>=35.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",                    # parquet snapshot IO
    "openpyxl>=3.1",                    # Excel downloads
    "pyyaml>=6.0",                      # configs (locations, plan, brand)
    "rapidfuzz>=3.6",                   # firm-name fuzzy clustering in snapshot refresh
    "google-cloud-bigquery>=3.23",      # only used by the refresh job (Daten page)
    "db-dtypes>=1.3",                   # DATE/TIME support for to_dataframe()
    "gcsfs>=2024.6",                    # snapshot IO when STAYERY_SNAPSHOT_DIR=gs://…
    "plotly>=5.24",
]

[project.optional-dependencies]
# Developer-only tooling. Install via: `uv sync --extra dev`
dev = [
    "ruff>=0.6",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenueblindspots"]

# ---------------------------------------------------------------------------
# Linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "dash_app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D"]
# D203/D213 conflict with the Google docstring convention.
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Dash pages/components follow the comment-header house style, not pydocstyle.
"dash_app/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
