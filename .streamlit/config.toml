# Stayery RevenueBlindSpots - Streamlit Theme + Performance Settings.
# Brand-Farben aus configs/stayery_brand.yaml übernommen.
# Yellow #FFE650 als Akzent, Schwarz für Text, Weiß als Grundfläche.

# ============================== Theme =====================================
[theme]
base = "light"
primaryColor = "#FFE650" 
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAF5"
textColor = "#000000"
font = "sans serif"


# ============================== Server / Performance =====================
[server]
maxUploadSize = 50
# Brand-Fonts aus streamlit_app/static/ servieren (Neue Haas Grotesk, Topol).
# CSS in components/brand.py referenziert ./app/static/fonts/...woff2.
enableStaticServing = true
# Don't watch source files for changes - saves CPU + RAM on a long-running
# session. If you're actively editing source, override via env:
# STREAMLIT_SERVER_FILE_WATCHER_TYPE=auto
fileWatcherType = "none"
# Disable websocket compression - burns CPU on every message; not worth it
# for plot-heavy pages.
enableWebsocketCompression = false
# Keep the WebSocket alive even on long-running script reruns (3 min)
runOnSave = false


# ============================== Runner ===================================
[runner]
# "Magic" pseudo-cells (auto-display of trailing expressions) cost a small
# but real amount on every rerun. Off → faster.
magicEnabled = false
# Don't post-process the script's output - saves a few ms per rerun.
postScriptGC = true


# ============================== Client UI ================================
[client]
toolbarMode = "minimal"
showErrorDetails = true


# ============================== Browser ==================================
[browser]
gatherUsageStats = false


# ============================== Logger ===================================
[logger]
# Reduce log volume - INFO has way too much noise for a single dev session.
level = "warning"
