# =============================================================================
# Stayery Brand Configuration
# =============================================================================

colors: 
  core:
    black:  "#000000"   # Text on light backgrounds
    white:  "#FFFFFF"   # Default chart background
    yellow: "#FFE650"   # Brand-defining accent
  supporting:
    pink:   "#F0B4C8"
    green:  "#08A064"
    orange: "#EB6E14"
    red:    "#E62828"
    blue:   "#1E4BA1"
    purple: "#6E32C8"

# Order in which colors are assigned to chart series.
# if a chart needs more than 6 colours, the palette recycles
categorical_order:
  - yellow
  - blue
  - green
  - orange
  - pink
  - purple

# Sequential palette anchor
# Used for heatmaps, choropleth-like encodings, occupancy matrices.
sequential_anchor: yellow

# Diverging palette for YoY % change, anomaly residuals, target deviation.
diverging:
  negative: red
  neutral:  white
  positive: green

typography:
  # Primary brand font for all text
  primary: "Neue Haas Grotesk Display Pro"
  primary_fallback:
    - "Neue Haas Grotesk"
    - "NeueHaasGroteskTextPro"
    - "Inter"
    - "Helvetica Neue"
    - "Helvetica"
    - "Arial"
    - "sans-serif"

  # Display font for emphasis
  display: "Topol"
  display_fallback:
    - "Topol"
    - "Inter"
    - "sans-serif"
